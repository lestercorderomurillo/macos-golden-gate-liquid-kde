name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  actions: read

jobs:
  promotion:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/require-ci.yml
    with:
      repository: ${{ github.repository }}
      sha: ${{ github.sha }}
      branches: '["dev"]'

  test:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install test dependencies
        run: python3 -m pip install pytest
      - name: Test the wrapper and release routing
        run: python3 -m pytest tests -q
