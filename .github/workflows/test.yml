name: tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify-published-pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: lestercorderomurillo/macos-tahoe-liquid-kde
          ref: v0.85.8
          path: reviewed-tahoe
      - name: Check immutable release archive and wrapper staging
        shell: bash
        env:
          MAC_TAHOE_NO_UPDATE_CHECK: 'true'
        run: |
          set -euo pipefail
          sha=$(git -C reviewed-tahoe rev-parse HEAD)
          test "$sha" = a826a41f5a40693711f9db113b08ac8ae0830f5b
          curl --fail --silent --show-error --location --retry 2 "https://codeload.github.com/lestercorderomurillo/macos-tahoe-liquid-kde/tar.gz/$sha" -o "$RUNNER_TEMP/published.tar.gz"
          cp reviewed-tahoe/VERSION VERSION
          jq --arg sha "$sha" --arg digest "$(sha256sum "$RUNNER_TEMP/published.tar.gz" | cut -d' ' -f1)" '.commit=$sha | .sha256=$digest | .version="0.85.8"' upstream.json > "$RUNNER_TEMP/pin"
          cp "$RUNNER_TEMP/pin" upstream.json
          python3 .agents/skills/paired-release/scripts/check_pair.py --tahoe reviewed-tahoe --golden . --archive "$RUNNER_TEMP/published.tar.gz"
          output=$(./installer --prepare)
          prepared=$(printf '%s\n' "$output" | tail -1)
          test "$(cat "$prepared/.golden-gate-ready")" = "$sha"
          cmp defaults.json "$prepared/src/scripts/defaults.json"
          cmp "$prepared/src/scripts/interface_icons.py" reviewed-tahoe/src/scripts/interface_icons.py
          cmp "$prepared/src/scripts/launcher_defaults.py" reviewed-tahoe/src/scripts/launcher_defaults.py
          test -s "$prepared/src/offline/wallpapers/MacGoldenGate/metadata.json"
          cp upstream.json "$RUNNER_TEMP/verified-upstream.json"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-published-pin
          path: ${{ runner.temp }}/verified-upstream.json
