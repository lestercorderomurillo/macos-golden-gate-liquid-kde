name: tests

on:
  push:
    branches: [dev]
    paths-ignore: ['**/*.md', 'src/screenshots/**']
  pull_request:
    branches: [main, dev]
    paths-ignore: ['**/*.md', 'src/screenshots/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install test dependencies
        run: python3 -m pip install pytest
      - name: Test the wrapper and release routing
        run: python3 -m pytest tests -q
