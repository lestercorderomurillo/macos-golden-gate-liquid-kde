name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Read immutable Tahoe pin
        id: pin
        run: |
          python3 - <<'PYCODE'
          import json, os, re
          pin = json.load(open('upstream.json'))
          assert pin['repository'] == 'lestercorderomurillo/macos-tahoe-liquid-kde'
          assert re.fullmatch('[a-f0-9]{40}', pin['commit'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + pin['commit'] + '\n')
          PYCODE
      - uses: actions/checkout@v5
        with:
          repository: lestercorderomurillo/macos-tahoe-liquid-kde
          ref: ${{ steps.pin.outputs.commit }}
          fetch-depth: 0
          path: tahoe
      - name: Check immutable Tahoe tag and archive
        timeout-minutes: 5
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, pathlib, subprocess, urllib.request
          pin = json.loads(pathlib.Path('upstream.json').read_text())
          version = pathlib.Path('VERSION').read_text().strip()
          tag = 'v' + version
          tagged = subprocess.check_output(
              ['git', '-C', 'tahoe', 'rev-parse', tag + '^{commit}'], text=True).strip()
          assert tagged == pin['commit'], 'Tahoe release tag does not match immutable pin'
          digest = hashlib.sha256()
          url = 'https://codeload.github.com/' + pin['repository'] + '/tar.gz/' + pin['commit']
          with urllib.request.urlopen(url, timeout=120) as response:
              while chunk := response.read(1024 * 1024):
                  digest.update(chunk)
          assert digest.hexdigest() == pin['sha256'], 'Published Tahoe archive checksum mismatch'
          PYCODE
      - name: Verify focused local evidence
        run: |
          python3 tahoe/.github/scripts/release_evidence.py --repo .
          test "$(git describe --tags --exact-match HEAD)" = "v$(cat VERSION)"
      - name: Publish installable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          printf 'Focused local checks and reviewed component captures passed. Full remote CI runs independently; inspect its current result before treating this release as fully qualified.\n\nhttps://github.com/%s/actions/workflows/test.yml\n' "$GITHUB_REPOSITORY" > /tmp/release-notes.txt
          release_flags=()
          if [[ "$tag" =~ rc\.?[0-9]+$ ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          gh release create "$tag" --verify-tag --title "$tag" --notes-file /tmp/release-notes.txt "${release_flags[@]}"
